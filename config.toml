[chat.reasoning]
provider = "anthropic"
model = "claude-sonnet-5"
max_tokens = 16384
thinking_budget = 4096

[chat.conversation]
provider = "gemini"
model = "gemini-3.6-flash"
max_tokens = 4096

[embed]
provider = "openai"
model = "text-embedding-3-small"
dimensions = 1536
max_batch_size = 64
max_text_length = 8192

[image.describe]
provider = "gemini"
model = "gemini-3.6-flash"
max_tokens = 2048
max_bytes = 10485760
max_prompt_length = 4000
allowed_media_types = ["image/jpeg", "image/png", "image/webp", "image/gif"]

[image.create]
provider = "gemini"
model = "gemini-3.1-flash-image"
max_prompt_length = 4000

[speech.transcribe]
provider = "deepgram"
model = "nova-3"
language = "multi"
max_bytes = 26214400
allowed_media_types = ["audio/wav", "audio/mpeg", "audio/mp4", "audio/ogg", "audio/webm", "audio/flac", "audio/aac", "audio/x-wav"]

[retry]
attempts = 3
backoff_seconds = [0.5, 1.0, 2.0]
timeout_seconds = 300
